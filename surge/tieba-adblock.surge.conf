# =====================================================================
# 百度贴吧 (Tieba) iOS 客户端 · Surge MITM 去广告 + 去埋点规则
# 规则来源: SpiderProxy MITM 抓包 (TBClient/12.87.1 · iOS 18.7)
# 适用: Surge iOS / Surge Mac (需开启 MITM 并信任根证书)
# =====================================================================
#
# 使用方法:
#   1. 把下方 [MITM] hostname 合并进你的配置,并用同一 CA 证书解密
#   2. 把下方 [Filter] 所有 REJECT 规则加入你的 [Filter]
#   3. 重启 Surge / 重开贴吧 App 生效
#
# 说明:
#   - 统计/埋点类: 屏蔽后完全无影响
#   - 推荐/商城类: 屏蔽后仅对应推广卡片消失
#   - 绝不整域屏蔽 tieba.baidu.com / tiebapic.baidu.com (会破坏主功能)

# =========================== [MITM] 段 ===========================
# 若要路径级 REJECT 生效,以下主机必须被 MITM 解密:
#（请合并进你现有配置的 [MITM] hostname,不要整体替换你的 CA）
# hostname = %APPEND% *.baidu.com, *.bdstatic.com, *.xdplt.com, *.bigda.com, *.toutiao.com

# =========================== [Filter] 段 ===========================
# ---------- A. 百度统计埋点 (安全屏蔽,无副作用) ----------
# sofire: 百度统计/性能上报
^https?://(sofire\.baidu\.com|sofire\.bdstatic\.com)/ = REJECT
# gsp0 的 track.gif: 页面曝光/点击埋点
^https?://gsp0\.baidu\.com/.*/track\.gif = REJECT
# heicha (黑盒): 反作弊/行为采集
^https?://dlswbr\.baidu\.com/heicha = REJECT
# 百度雷达 RTB/广告 SDK
^https?://tb3?\.bdstatic\.com/radar-sdk/ = REJECT

# ---------- B. 第三方广告/数据采集 SDK (安全屏蔽) ----------
# 头条系广告联盟 (pglstatp-toutiao.com)
^http://lf6-sf-be-pack-sign\.pglstatp-toutiao\.com/ = REJECT
# 小滴/头条系第三方统计
^https?://(rpe|cd)\.xdplt\.com/ = REJECT
# 明度 weirwood-sdk (dmpstatic.cdn.bcebos.com 上,只读 weirwood 路径)
^https?://dmpstatic\.cdn\.bcebos\.com/weirwood-sdk/ = REJECT
# bigda 日志
^https?://mlog\.bigda\.com/ = REJECT

# ---------- C. 贴吧商城/推广物料 (谨慎屏蔽,去掉推广卡片) ----------
# 吧内商城推广信息流
^https?://tieba\.baidu\.com/c/f/forum/shopGoodsFeed = REJECT
# 首页素材/活动位
^https?://tieba\.baidu\.com/c/f/material/home = REJECT
# 广告展示日志上报 (可选:屏蔽后广告投放可能回落默认策略)
# ^https?://tiebac\.baidu\.com/c/s/adLog = REJECT

# =========================== 保底规则 ===========================
# 免责: 以下绝不要屏蔽
# tieba.baidu.com / tiebapic.baidu.com / tb*.bdstatic.com / imgsrc.baidu.com
# 均为主功能与图片资源,请保持 REJECT 之外的直连策略。
