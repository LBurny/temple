# =====================================================================
# 天翼云盘 (189.cn) iOS 客户端 · Surge MITM 去广告 + 去埋点规则
# 规则来源: SpiderProxy MITM 抓包 (中国电信天翼云盘 11.1.0 · iOS 18.7)
# 适用: Surge iOS / Surge Mac (需开启 MITM 并信任根证书)
# =====================================================================
#
# 使用方法:
#   1. 把下方 [MITM] hostname 合并进你的配置,并用同一 CA 证书解密
#   2. 把下方 [Filter] 所有 REJECT 规则加入你的 [Filter]
#   3. 重启 Surge / 重开 App 生效
#
# 注意:
#   api.cloud.189.cn 是唯一的 API 主域名(登录/文件/上传都在上面)。
#   因此只能做"路径级"正则屏蔽,绝对不能整域 REJECT,否则云盘无法使用。
#   下方所有 REJECT 规则都必须放在最后的保底放行规则之前。

# =========================== [MITM] 段 ===========================
# 以下主机需被 MITM 解密(Rule 中的完整 URL 需要);请合并进现有配置:
# hostname = %APPEND% *.cloud.189.cn, *.21cn.com, e.dlife.cn

# =========================== [Filter] 段 ===========================
# ---------- A. 埋点/统计 (安全屏蔽,无副作用) ----------
# App 使用统计上报 (ux.21cn.com 为第三方统计 SDK)
^https?://ux\.21cn\.com/(pb/appReportRest|visualizationEvent)/ = REJECT
# 云图/授权分类统计
^https?://api\.yuntu\.21cn\.com/ = REJECT
# 电信生活服务/外部配置
^https?://e\.dlife\.cn/ = REJECT
# 用户行为采集
^https?://api\.cloud\.189\.cn/collectRecords\.action = REJECT
# token 上报
^https?://api\.cloud\.189\.cn/reportToken\.action = REJECT

# ---------- B. 广告位 / 推广位 (屏蔽后对应卡片消失) ----------
# 开屏广告
^https?://api\.cloud\.189\.cn/guns/getOpenscreenBanners\.action = REJECT
# 页面内广告位 (全 serviceType)
^https?://api\.cloud\.189\.cn/guns/getPageBanners\.action = REJECT
# 首页皮肤/推广横幅
^https?://api\.cloud\.189\.cn/guns/getHomePageSkinBanner\.action = REJECT
# 相册推荐卡片
^https?://api\.cloud\.189\.cn/album/listRecommendCards\.action = REJECT
# 会员/Logo 标识 (可选: 屏蔽后可能不显示 VIP 图标)
^https?://api\.cloud\.189\.cn/order/(queryUserLogo|getInValidUserLogo)\.action = REJECT
# 闪屏广告配置源
^https?://cloud\.189\.cn/(include/splash/splashconfig\.xml|download/client/configs/cloud_router\.json) = REJECT

# 推送统计回执 (可选: 若之后收不到推送通知,删掉下面这行)
# ^https?://client-push\.21cn\.com:30002/v3/report = REJECT

# =========================== 保底放行 ===========================
# 其余 api.cloud.189.cn 全部直连 (登录/文件列表/上传/家庭共享等核心功能)
# 注意: 以下保底规则必须排在所有 api.cloud.189.cn 的 REJECT 之后。
# ^https?://api\.cloud\.189\.cn/ = DIRECT
